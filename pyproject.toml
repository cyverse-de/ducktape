[project]
name = "ducktape"
version = "0.3.0"
description = "An fsspec filesystem backend for iRODS, built on python-irodsclient"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "John Wregglesworth", email = "wregglej@arizona.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "fsspec>=2026.6.0",
    "python-irodsclient>=2.2.0",
]

[project.entry-points."fsspec.specs"]
irods = "ducktape.filesystem:DucktapeFileSystem"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb>=1.5.3",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
